ops:
  gold_imagery_embeddings:
    config:
      output_prefix: gs://crimenet/gold/imagery/embeddings/foundation_v1

      device: cuda
      precision: bf16

      naip_image_size: 512
      naip_batch_size: 8
      naip_prefetch_batches: 16
      naip_reader_workers: 8
      naip_read_chunk_size: 128

      sentinel_image_size: 128
      sentinel_batch_size: 64
      sentinel_max_timesteps: 12
      sentinel_lookback_days: 400

      sentinel_reader_workers: 16
      sentinel_prefetch_groups: 64
      sentinel_scene_cache_size: 256
      sentinel_remote_band_workers: 0

      # Stage every referenced patched Sentinel COG exactly once, then all
      # Rasterio H3/window reads are local. Change this path to an attached SSD
      # mount if the VM's root disk is too small.
      sentinel_local_stage: true
      sentinel_local_stage_dir: /mnt/disks/sentinel-cache
      sentinel_stage_workers: 8
      sentinel_stage_free_space_reserve_gb: 10.0

      rows_per_shard: 5000
      resume: true
      overwrite: false

      limit_naip_rows: 0
      limit_sentinel_h3_cells: 0
