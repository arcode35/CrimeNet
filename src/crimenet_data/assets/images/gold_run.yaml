ops:
  gold_imagery_embeddings:
    config:
      output_prefix: gs://crimenet/gold/imagery/embeddings/foundation_v1

      device: cuda
      precision: bf16

      # NAIP is already complete; resume will skip existing deterministic shards.
      naip_image_size: 512
      naip_batch_size: 8
      naip_prefetch_batches: 16
      naip_reader_workers: 8
      naip_read_chunk_size: 128

      # Patched13 Sentinel -> OlmoEarth.
      sentinel_image_size: 128
      sentinel_batch_size: 32
      sentinel_max_timesteps: 12
      sentinel_lookback_days: 400

      # v5: larger bounded async producer window. Completed H3 reads are consumed
      # as soon as they finish, while output remains exact dataframe order.
      sentinel_reader_workers: 32
      sentinel_prefetch_groups: 128
      sentinel_scene_cache_size: 256
      sentinel_remote_band_workers: 0

      rows_per_shard: 5000
      resume: true
      overwrite: false

      limit_naip_rows: 0
      limit_sentinel_h3_cells: 0
