model:
  family: xgboost
  module: machine_learning.models.xgboost.model
  validation_module: machine_learning.models.xgboost.validation
  name: xgb_pp_transfer_v2
  description: Geographic-transfer XGBoost point-process baseline

data:
  source: current_final_model_snapshot
  train_split: train
  validation_split: validation
  train_fraction: 1.0
  validation_fraction: 1.0
  seed: 42

features:
  feature_set: transferable_v2
  categorical: [lighting_condition]
  numeric:
    - local_hour
    - local_day_of_week
    - local_hour_sin
    - local_hour_cos
    - local_day_of_week_sin
    - local_day_of_week_cos
    - socio_population
    - socio_median_age
    - socio_median_household_income
    - socio_poverty_rate
    - socio_unemployment_rate
    - socio_vacancy_rate
    - socio_renter_occupied_rate
    - socio_no_vehicle_rate
    - osm_poi_density_per_km2
    - osm_nightlife_poi_density_per_km2
    - osm_food_poi_density_per_km2
    - osm_retail_poi_density_per_km2
    - osm_transit_poi_density_per_km2
    - osm_road_length_density_m_per_km2
    - osm_major_road_density_m_per_km2
    - osm_intersection_density_per_km2
    - osm_dead_end_density_per_km2
    - osm_building_density_per_km2
    - osm_major_road_length_ratio
    - osm_residential_road_length_ratio
    - osm_service_road_length_ratio
    - osm_one_way_road_length_ratio
    - osm_tracked_poi_category_entropy
    - osm_land_use_category_entropy
    - osm_commercial_residential_mix_ratio
    - weather_temperature_2m_c
    - weather_relative_humidity_2m_pct
    - weather_available
    - solar_elevation_deg
    - solar_azimuth_deg
    - is_daylight
    - cell_crime_count_6h
    - cell_crime_count_24h
    - cell_crime_count_7d
    - cell_crime_count_28d
    - cell_violent_count_6h
    - cell_violent_count_24h
    - cell_violent_count_7d
    - cell_violent_count_28d
    - cell_property_count_6h
    - cell_property_count_24h
    - cell_property_count_7d
    - cell_property_count_28d
    - k1_crime_count_6h
    - k1_crime_count_24h
    - k1_crime_count_7d
    - k1_crime_count_28d
    - has_crime_cell_28d
    - hours_since_last_crime_cell_capped_28d
    - cell_crime_24h_vs_28d_ratio
    - cell_share_of_k1_crime_24h
  include_city_history: false
  include_solar_zenith: false

architecture:
  objective: point_process_poisson
  tree_method: hist
  device: cuda
  max_bin: 256
  max_depth: 8
  max_cat_to_onehot: 4

optimization:
  learning_rate: 0.03
  subsample: 0.80
  colsample_bytree: 0.80
  min_child_weight: 50.0
  max_delta_step: 1.0
  gamma: 0.0
  reg_lambda: 10.0
  reg_alpha: 0.0

training:
  num_boost_round: 4000
  early_stopping_rounds: 150
  verbose_eval: 25

validation:
  geographic_holdout_cities: []
  report_in_domain_validation: true
  aggregation: [global, macro_city, per_city]

numerics:
  min_log_intensity: -30.0
  max_log_intensity: 15.0
  hessian_floor: 1.0e-6
  event_exposure_tolerance: 1.0e-12

artifacts:
  output_root: artifacts/experiments
