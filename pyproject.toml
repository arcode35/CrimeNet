[project]
name = "crimenet"
version = "0.1.0"
description = "Multi-city crime data lakehouse built on Databricks and Delta Lake"
requires-python = ">=3.11"
dependencies = [
    "pvlib==0.15.2",
]
[project.scripts]
bronze_ingestion = "crimenet.jobs.bronze_ingestion:main"
silver_transform = "crimenet.jobs.silver_transform:main"
quality_checks = "crimenet.jobs.quality_checks:main"
gold_refresh = "crimenet.jobs.gold_refresh:main"
silver_weather = "crimenet.jobs.silver_weather_job:main"
acs5_landing = "crimenet.jobs.acs5_landing_job:main"
silver_socioeconomic = "crimenet.jobs.silver_socioeconomic_job:main"
gold_crime_features = "crimenet.jobs.gold_crime_features_job:main"
silver_lighting = "crimenet.jobs.silver_lighting_job:main"
weather_acquisition = "crimenet.jobs.weather_acquisition_job:main"
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "pyspark==4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crimenet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: deterministic local unit tests",
    "integration: local multi-component and materialization tests",
    "databricks: requires Databricks-only functions or workspace resources",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
