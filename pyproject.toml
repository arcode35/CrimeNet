[project]
name = "crimenet_data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "dagster==1.13.16",
    "dagster-webserver>=1.13.16",

    # Data / storage
    "deltalake>=1.6.2",
    "duckdb>=1.5.5",
    "gcsfs>=2026.7.0",
    "google-auth>=2.56.2",
    "google-cloud-storage",
    "pyarrow>=25.0.0",
    "polars>=1.43.2",

    # Geospatial
    "h3>=4.5.0",
    "planetary-computer>=1.0.0",
    "pystac",
    "polars-h3>=0.6.1",
    "pvlib>=0.15.2",
    "pyproj>=3.7.1",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",

    # ML
    "mlflow>=3.15.1",
    "optuna>=4.9.0",
    "torch>=2.13.0",
    "torchvision",
    "transformers",
    "huggingface-hub",
    "olmoearth-pretrain-minimal",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dagster]
module_name = "crimenet_data.definitions"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "crimenet_data"
defs_module = "crimenet_data.defs"
code_location_target_module = "crimenet_data.definitions"
code_location_name = "crimenet-data"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true