[project]
name = "crimenet_data"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.16",
    "dagster-webserver>=1.13.16",
    "deltalake>=1.6.2",
    "duckdb>=1.5.5",
    "gcsfs>=2026.7.0",
    "google-auth>=2.56.2",
    "h3>=4.5.0",
    "mlflow>=3.15.1",
    "polars>=1.43.2",
    "polars-h3>=0.6.1",
    "pvlib>=0.15.2",
    "pyarrow>=25.0.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }


[tool.dagster]
module_name = "crimenet_data.definitions"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "crimenet_data"
defs_module = "crimenet_data.defs"
code_location_target_module = "crimenet_data.definitions"
code_location_name = "crimenet-data"
