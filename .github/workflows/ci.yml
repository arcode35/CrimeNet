name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Java for local Spark tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint source and tests
        run: uv run ruff check src tests

      - name: Run ordinary unit and local integration tests
        run: >
          uv run pytest tests/unit tests/integration
          -m "not databricks"

      # `databricks bundle validate` always resolves the current workspace
      # identity, even with a literal CI root path. Keep it credential-gated
      # while the complete local test job above remains credential-free.
      - name: Install Databricks CLI
        if: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' }}
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        if: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

      - name: Explain credential-gated bundle validation
        if: ${{ secrets.DATABRICKS_HOST == '' || secrets.DATABRICKS_TOKEN == '' }}
        run: >
          echo "Authenticated bundle validation was not run because
          DATABRICKS_HOST and DATABRICKS_TOKEN are not configured;
          ordinary unit and local integration tests remain mandatory."
