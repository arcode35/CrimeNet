name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Java for Spark and Delta tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify lock file
        run: uv lock --check

      - name: Verify production dependency export
        run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt | diff - requirements-prod.txt

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Compile source and tests
        run: uv run python -m compileall -q src tests

      - name: Run local unit and Delta integration tests
        run: uv run pytest --cov=crimenet --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Build wheel and source distribution
        run: uv build

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.299.2

      - name: Validate bundle configuration
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        if: ${{ env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != '' }}
        run: databricks bundle validate -t dev

      - name: Explain credential-gated workspace validation
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        if: ${{ env.DATABRICKS_HOST == '' || env.DATABRICKS_TOKEN == '' }}
        run: >
          echo "Static bundle/entry-point validation passed in pytest;
          authenticated 'databricks bundle validate -t dev' requires the
          DATABRICKS_HOST and DATABRICKS_TOKEN repository secrets."
