experiment:
  name: xgb_history_poisson_v1
  feature_set: history_v1
  random_seed: 42

data:
  dataset_dir: crimenet_datasets/ml_spatiotemporal_examples_k5
  parquet_glob: "**/*.parquet"

  split_column: dataset_split
  event_count_column: event_multiplicity
  integration_weight_column: importance_weight

  categorical_columns:
    - offense_mark

  metadata_columns:
    - example_id
    - example_timestamp_utc
    - osm_h3_cell_id
    - source_city
    - is_observed_event

model:
  objective: count:poisson
  eval_metric: poisson-nloglik

  n_estimators: 3000
  learning_rate: 0.03
  max_depth: 8
  min_child_weight: 1.0

  subsample: 0.8
  colsample_bytree: 0.8

  reg_alpha: 0.0
  reg_lambda: 1.0
  gamma: 0.0

  max_delta_step: 0.7
  max_bin: 256

  tree_method: hist
  device: cpu
  n_jobs: -1

  early_stopping_rounds: 100

training:
  verbose_eval: 25

output:
  artifact_dir: artifacts/xgboost
  save_test_predictions: true
