targets:
  prod:
    mode: production

    git:
      branch: main

    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: crimenet_prod
      preflight_mode: validate
      minimum_acs_tracts_per_vintage: 5000
      minimum_tiger_tracts_per_vintage: 5000
      maximum_boundary_quarantine_records: 0
      maximum_ambiguous_spatial_matches: 0
      minimum_silver_to_bronze_ratio: 0.50
      maximum_silver_to_bronze_ratio: 1.01
      maximum_coordinate_null_rate: 0.50
      maximum_quarantine_rate: 0.05
      minimum_weather_coverage: 0.90
      minimum_lighting_coverage: 0.95
      minimum_acs_coverage: 0.80
      minimum_tract_coverage: 0.90
      maximum_invalid_location_rate: 0.50
      maximum_unmatched_location_rate: 0.10

    run_as:
      service_principal_name: ${var.production_service_principal_name}

    permissions:
      - service_principal_name: ${var.production_service_principal_name}
        level: CAN_MANAGE
