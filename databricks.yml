bundle:
  name: crimenet
  databricks_cli_version: ">=1.9.0"

include:
  - resources/jobs/*.yml
  - targets/*.yml

variables:
  crime_cities:
    description: JSON array of enabled crime sources
    default: '["dallas", "fort_worth", "chicago", "new_york", "seattle", "san_francisco", "washington_dc", "baltimore"]'

  catalog:
    description: Unity Catalog catalog receiving tables and pipeline state

  bronze_schema:
    description: Bronze table schema
    default: bronze

  silver_schema:
    description: Silver table schema
    default: silver

  gold_schema:
    description: Gold table schema
    default: gold

  ops_schema:
    description: Operational metadata and state schema
    default: ops

  data_quality_schema:
    description: Data-quality and quarantine schema
    default: data_quality

  integration_test_schema:
    description: Schema containing staging integration-test tables
    default: integration_test

  raw_landing_path:
    description: Shared read-only raw landing volume
    default: /Volumes/crimenet_dev/raw_files/landing

  checkpoints_path:
    description: Root path for Structured Streaming checkpoints
    default: /Volumes/crimenet_dev/ops/checkpoints

  autoloader_schema_path:
    description: Root path for Auto Loader inferred schemas
    default: /Volumes/crimenet_dev/ops/autoloader_schemas

  test_fixtures_path:
    description: Staging volume receiving CI integration-test fixtures
    default: test_fixtures

artifacts:
  default:
    type: whl
    path: .
    build: uv build

sync:
  paths:
    - src
