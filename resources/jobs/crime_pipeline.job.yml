resources:
  jobs:
    crime_pipeline:
      name: CrimeNet crime-data pipeline
      description: >
        Ingests Dallas, Houston, and Fort Worth crime data into Bronze,
        standardizes the sources into Silver, validates quality, and refreshes
        Gold tables.

      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_dallas
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --city
              - dallas
              - --input-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/dallas

          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: bronze_houston
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --city
              - houston
              - --input-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/houston

          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: bronze_fort_worth
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --city
              - fort_worth
              - --input-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/fort_worth

          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver_transform
          environment_key: default

          depends_on:
            - task_key: bronze_dallas
            - task_key: bronze_houston
            - task_key: bronze_fort_worth

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_transform
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --silver-schema
              - ${var.silver_schema}
              - --data-quality-schema
              - ${var.data_quality_schema}

          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: quality_checks
          environment_key: default

          depends_on:
            - task_key: silver_transform

          python_wheel_task:
            package_name: crimenet
            entry_point: quality_checks
            parameters:
              - --catalog
              - ${var.catalog}
              - --silver-schema
              - ${var.silver_schema}
              - --data-quality-schema
              - ${var.data_quality_schema}
        - task_key: bronze_open_meteo_weather
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --source
              - open_meteo_weather

              - --input-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/weather/open_meteo

              - --schema-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.autoloader_schemas_volume}/open_meteo_weather

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_volume}/open_meteo_weather

              - --write-mode
              - append
        - task_key: silver_weather_hourly

          depends_on:
            - task_key: bronze_open_meteo_weather

          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_weather
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --silver-schema
              - ${var.silver_schema}

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_volume}/silver/weather_hourly
        - task_key: gold_crime_features
          environment_key: default

          depends_on:
            - task_key: quality_checks
            - task_key: silver_weather_hourly
            - task_key: silver_acs5_tracts
            - task_key: silver_lighting_conditions

          python_wheel_task:
            package_name: crimenet
            entry_point: gold_crime_features
            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - ${var.silver_schema}

              - --gold-schema
              - ${var.gold_schema}

              - --weather-provider
              - open_meteo

              - --weather-model
              - era5_land

              - --weather-h3-resolution
              - "6"

          max_retries: 1
          min_retry_interval_millis: 120000
        - task_key: land_acs5_tracts
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: acs5_landing
            parameters:
              - --landing-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/socioeconomic

              - --start-vintage
              - "2012"

              - --end-vintage
              - "2024"

              - --state-fips
              - "48"

        - task_key: bronze_acs5_tracts

          depends_on:
            - task_key: land_acs5_tracts

          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --source
              - acs5_tract

              - --input-path
              - /Volumes/${var.catalog}/${var.raw_files_schema}/${var.landing_volume}/socioeconomic/acs5/tract

              - --schema-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.autoloader_schemas_volume}/acs5_tract

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_volume}/bronze/acs5_tract

              - --write-mode
              - append
        - task_key: silver_acs5_tracts
          depends_on:
            - task_key: bronze_acs5_tracts

          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_socioeconomic
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --silver-schema
              - ${var.silver_schema}

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_volume}/silver/acs5_tract

          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: silver_lighting_conditions
          environment_key: default

          depends_on:
            - task_key: silver_transform

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_lighting
            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - ${var.silver_schema}

          max_retries: 1
          min_retry_interval_millis: 60000
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
              - pvlib==0.15.2
