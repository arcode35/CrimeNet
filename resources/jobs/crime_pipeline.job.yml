resources:
  jobs:
    crime_pipeline:
      name: ${bundle.target}-CrimeNet-crime-data-pipeline

      description: >
        Ingests and standardizes multi-city crime data into Bronze and Silver,
        enriches canonical incidents with weather, socioeconomic, lighting,
        and OpenStreetMap features, and refreshes Gold modeling tables.

      max_concurrent_runs: 1

      tasks:
        # ============================================================
        # CRIME BRONZE INGESTION
        # ============================================================
        - task_key: acquire_open_meteo_weather
          depends_on:
            - task_key: publish_canonical_silver

          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: weather_acquisition
            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - ${var.silver_schema}

              - --ops-schema
              - ${var.ops_schema}

              - --crime-table
              - crime_offenses

              - --raw-landing-path
              - ${var.raw_landing_path}

              - --cities
              - dallas
              - fort_worth
              - new_york
              - chicago
              - san_francisco
              - seattle
              - baltimore
              - washington_dc

              - --start-year
              - "2013"

              - --end-year
              - "2025"

              - --model
              - era5_land

              - --h3-resolution
              - "6"

              - --max-requests
              - "2"

              - --pause-seconds
              - "0.25"

          max_retries: 2
          min_retry_interval_millis: 120000

        - task_key: acquire_crime_data
          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: crime_acquisition
            parameters:
              - --cities
              - dallas
              - fort_worth
              - chicago
              - new_york
              - san_francisco
              - seattle
              - baltimore
              - washington_dc

              - --start-year
              - "2025"

              - --end-year
              - "2025"

              - --output-root
              - ${var.raw_landing_path}

              - --socrata-page-size
              - "25000"

              - --arcgis-page-size
              - "2000"

              - --pause-seconds
              - "0.10"

              - --socrata-secret-scope
              - crimenet

              - --socrata-secret-key
              - socrata-app-token

          max_retries: 2
          min_retry_interval_millis: 120000

        - task_key: bronze_cities
          for_each_task:
            inputs: >-
              [
                {
                  "source": "seattle",
                  "directory": "seattle"
                },
                {
                  "source": "chicago",
                  "directory": "chicago"
                },
                {
                  "source": "new_york",
                  "directory": "new_york"
                },
                {
                  "source": "san_francisco",
                  "directory": "san_francisco"
                },
                {
                  "source": "baltimore",
                  "directory": "baltimore"
                },
                {
                  "source": "washington_dc",
                  "directory": "washington_dc"
                },
                {
                  "source": "dallas",
                  "directory": "dallas_parquet"
                },
                {
                  "source": "fort_worth",
                  "directory": "fort_worth_parquet"
                }
              ]
            concurrency: 4
            task:
              task_key: bronze_city
              environment_key: default

              python_wheel_task:
                package_name: crimenet
                entry_point: bronze_ingestion
                parameters:
                  - --catalog
                  - ${var.catalog}

                  - --bronze-schema
                  - bronze

                  - --source
                  - "{{input.source}}"

                  - --input-path
                  - "${var.raw_landing_path}/{{input.directory}}"

                  - --schema-path
                  - "${var.autoloader_schema_path}/bronze/{{input.source}}"

                  - --checkpoint-path
                  - "${var.checkpoints_path}/bronze/{{input.source}}"
        # ============================================================
        # CANONICAL CRIME SILVER
        # ============================================================

        - task_key: canonical_silver_cities

          depends_on:
            - task_key: bronze_cities

          for_each_task:
            inputs: >-
              [
                "dallas",
                "fort_worth",
                "new_york",
                "chicago",
                "san_francisco",
                "seattle",
                "baltimore",
                "washington_dc"
              ]

            concurrency: 8

            task:
              task_key: canonical_silver_city
              environment_key: default

              python_wheel_task:
                package_name: crimenet
                entry_point: canonical_silver

                parameters:
                  - --catalog
                  - ${var.catalog}

                  - --bronze-schema
                  - bronze

                  - --silver-schema
                  - silver

                  - --minimum-year
                  - "2014"

                  - --city
                  - "{{input}}"
        - task_key: publish_canonical_silver

          depends_on:
            - task_key: canonical_silver_cities

          environment_key: default

          python_wheel_task:
            package_name: crimenet
            entry_point: publish_canonical_silver

            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - silver
        # ============================================================
        # WEATHER
        # ============================================================
        - task_key: bronze_open_meteo_weather
          environment_key: default

          depends_on:
            - task_key: acquire_open_meteo_weather

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --source
              - open_meteo_weather

              - --input-path
              - ${var.raw_landing_path}/weather/open_meteo

              - --schema-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.autoloader_schema_path}/open_meteo_weather

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_path}/bronze/open_meteo_weather

              - --write-mode
              - append

          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver_weather_hourly
          environment_key: default

          depends_on:
            - task_key: bronze_open_meteo_weather

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_weather
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --silver-schema
              - ${var.silver_schema}

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_path}/silver/weather_hourly

          max_retries: 1
          min_retry_interval_millis: 60000

        # ============================================================
        # ACS 5-YEAR SOCIOECONOMIC DATA
        # ============================================================

        - task_key: acquire_acs5_tracts
          environment_key: default

          depends_on:
            - task_key: publish_canonical_silver

          python_wheel_task:
            package_name: crimenet
            entry_point: acs5_landing
            parameters:
              - --metros
              - new_york
              - chicago
              - san_francisco
              - seattle
              - baltimore
              - washington_dc

              - --start-vintage
              - "2012"

              - --end-vintage
              - "2024"

              - --output-root
              - ${var.raw_landing_path}/socioeconomic/acs5/tract

              - --secret-scope
              - crimenet

              - --secret-key
              - census-api-key

              - --pause-seconds
              - "0.25"

          max_retries: 2
          min_retry_interval_millis: 120000

        - task_key: bronze_acs5_tracts
          environment_key: default

          depends_on:
            - task_key: acquire_acs5_tracts

          python_wheel_task:
            package_name: crimenet
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --source
              - acs5_tract

              - --input-path
              - ${var.raw_landing_path}/socioeconomic/acs5/tract

              - --schema-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.autoloader_schema_path}/acs5_tract

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_path}/bronze/acs5_tract

              - --write-mode
              - append

          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver_acs5_tracts
          environment_key: default

          depends_on:
            - task_key: bronze_acs5_tracts

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_socioeconomic
            parameters:
              - --catalog
              - ${var.catalog}

              - --bronze-schema
              - ${var.bronze_schema}

              - --silver-schema
              - ${var.silver_schema}

              - --checkpoint-path
              - /Volumes/${var.catalog}/${var.ops_schema}/${var.checkpoints_path}/silver/acs5_tract

          max_retries: 1
          min_retry_interval_millis: 60000

        # ============================================================
        # LIGHTING CONDITIONS
        # ============================================================

        - task_key: silver_lighting_conditions
          environment_key: default

          depends_on:
            - task_key: publish_canonical_silver

          python_wheel_task:
            package_name: crimenet
            entry_point: silver_lighting
            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - ${var.silver_schema}

          max_retries: 1
          min_retry_interval_millis: 60000

        # ============================================================
        # GOLD FEATURE TABLE
        # ============================================================

        - task_key: gold_crime_features
          environment_key: default

          depends_on:
            - task_key: silver_weather_hourly
            - task_key: silver_acs5_tracts
            - task_key: silver_lighting_conditions

          python_wheel_task:
            package_name: crimenet
            entry_point: gold_crime_features
            parameters:
              - --catalog
              - ${var.catalog}

              - --silver-schema
              - ${var.silver_schema}

              - --gold-schema
              - ${var.gold_schema}

              - --weather-provider
              - open_meteo

              - --weather-model
              - era5_land

              - --weather-h3-resolution
              - "6"

          max_retries: 1
          min_retry_interval_millis: 120000

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
              - pvlib==0.15.2
